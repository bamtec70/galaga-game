<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000008" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>GALAGA - Namco 1981 (Build V31)</title>
  <!-- New filenames force browsers past stale caches -->
  <link rel="stylesheet" href="galaga-v31.css?v=galaga-v31" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="game-wrapper">

    <div id="canvas-wrap">
      <canvas id="game" width="896" height="1152"></canvas>
      <div id="overlay">
        <div id="overlay-title">GALAGA</div>
        <div id="overlay-sub">INSERT COIN</div>
        <div id="overlay-hint">BUILD V31 - PRESS SPACE OR TAP</div>
        <div id="overlay-controls">
          LEFT/RIGHT / A D - MOVE · SPACE - FIRE<br />
          BOSS TRACTOR BEAM CAPTURES YOUR FIGHTER<br />
          SHOOT THE DIVING BOSS TO RESCUE · DUAL FIGHTER<br />
          FORMATION KILL WITH CAPTIVE · HOSTILE SHIP<br />
          M - MUTE · MUST SEE "BUILD V31"
        </div>
      </div>
    </div>

    <div id="mobile-controls" aria-label="Touch controls">
      <div class="mobile-col v30-left">
        <button type="button" id="btn-left" class="mobile-btn" aria-label="Left">◀</button>
        <button type="button" id="btn-right" class="mobile-btn" aria-label="Right">▶</button>
      </div>
      <div class="mobile-col v30-mid">
        <button type="button" id="btn-pause" class="mobile-btn" aria-label="Pause">Ⅱ</button>
        <button type="button" id="btn-mute" class="mobile-btn" aria-label="Mute">♪</button>
      </div>
      <div class="mobile-col v30-right">
        <button type="button" id="btn-fire" class="mobile-btn fire" aria-label="Fire">FIRE</button>
      </div>
    </div>
  </div>
  <script src="galaga-v31.js"></script>
<script>(function(){var t;function f(){clearTimeout(t);t=setTimeout(function(){document.documentElement.style.height=window.innerHeight+"px";window.dispatchEvent(new Event("resize"));},60);}window.addEventListener("orientationchange",function(){f();setTimeout(f,350);setTimeout(f,800);});if(window.visualViewport)visualViewport.addEventListener("resize",f);if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener("change",f);})();</script>
</body>
</html>
